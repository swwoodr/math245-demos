<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Euler's Method</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<div class="demo-wrap">
  <a class="back-link" href="/">← All Demos</a>
  <h1>Euler's Method</h1>
  <p class="demo-eq">$y_{n+1} = y_n + h\,f(x_n,\,y_n)$</p>

  <div class="demo-layout">
    <div class="controls">

      <div class="ctrl-section">Equation  y′ = f(x, y)</div>
      <div class="ctrl-row">
        <select id="ode-sel" onchange="onOdeChange()">
          <option value="y">y  &nbsp; (exponential growth)</option>
          <option value="neg-y">−y  &nbsp; (exponential decay)</option>
          <option value="x-y">x − y</option>
          <option value="sinx">sin(x)</option>
          <option value="logistic">y(1 − y)  &nbsp; (logistic)</option>
          <option value="x2">x²  &nbsp; (polynomial)</option>
        </select>
      </div>

      <div class="ctrl-section">Initial Condition</div>
      <div class="ctrl-row">
        <div class="ctrl-label">x₀ <span class="ctrl-val" id="x0-v">0.0</span></div>
        <input type="range" id="x0-s" min="-2" max="2" step="0.1" value="0"
               oninput="sv('x0-v',this.value);schedule()">
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label">y₀ <span class="ctrl-val" id="y0-v">1.0</span></div>
        <input type="range" id="y0-s" min="-3" max="3" step="0.1" value="1.0"
               oninput="sv('y0-v',this.value);schedule()">
      </div>

      <div class="ctrl-section">Euler Parameters</div>
      <div class="ctrl-row">
        <div class="ctrl-label">Step size h <span class="ctrl-val" id="h-v">0.50</span></div>
        <input type="range" id="h-s" min="0.05" max="2" step="0.05" value="0.5"
               oninput="document.getElementById('h-v').textContent=parseFloat(this.value).toFixed(2);schedule()">
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label">Steps n <span class="ctrl-val" id="n-v">8</span></div>
        <input type="range" id="n-s" min="1" max="30" step="1" value="8"
               oninput="sv('n-v',this.value);schedule()">
      </div>

      <div style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border);">
        <div id="formula-box" style="text-align:center;min-height:3rem;font-size:0.85rem;color:var(--muted);">
        </div>
      </div>

    </div>

    <div class="plot-panel">
      <div class="plot-box"><div id="main-plot" style="height:420px;"></div></div>

      <div class="metrics-row cols-3">
        <div class="metric"><div class="metric-label">Final Euler y</div><div class="metric-value" id="m-yE">—</div></div>
        <div class="metric"><div class="metric-label">Final Exact y</div><div class="metric-value plain" id="m-yT">—</div></div>
        <div class="metric"><div class="metric-label">Final |Error|</div><div class="metric-value" id="m-err">—</div></div>
      </div>

      <!-- Step table -->
      <div class="expander">
        <div class="expander-head" onclick="toggleExp(this)">
          <span>📋 Step-by-step table</span>
          <span class="expander-arrow">▼</span>
        </div>
        <div class="expander-body hidden" id="step-table-wrap">
          <div style="overflow-x:auto;">
            <table id="step-table" style="width:100%;border-collapse:collapse;font-size:0.8125rem;">
              <thead>
                <tr style="background:var(--card-alt);">
                  <th style="padding:0.5rem;border-bottom:1px solid var(--border);text-align:right;color:var(--muted);">n</th>
                  <th style="padding:0.5rem;border-bottom:1px solid var(--border);text-align:right;color:var(--muted);">xₙ</th>
                  <th style="padding:0.5rem;border-bottom:1px solid var(--border);text-align:right;color:var(--muted);">yₙ (Euler)</th>
                  <th style="padding:0.5rem;border-bottom:1px solid var(--border);text-align:right;color:var(--muted);">y (Exact)</th>
                  <th style="padding:0.5rem;border-bottom:1px solid var(--border);text-align:right;color:var(--muted);">|Error|</th>
                </tr>
              </thead>
              <tbody id="step-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── ODE library ───────────────────────────────────────────────────────────────
const ODES = {
  'y':       { f:(x,y)=>y,          latex:"y' = y",          exact:(x,x0,y0)=>y0*Math.exp(x-x0) },
  'neg-y':   { f:(x,y)=>-y,         latex:"y' = -y",         exact:(x,x0,y0)=>y0*Math.exp(-(x-x0)) },
  'x-y':     { f:(x,y)=>x-y,        latex:"y' = x - y",      exact:(x,x0,y0)=>(y0-x0+1)*Math.exp(-(x-x0))+x-1 },
  'sinx':    { f:(x,_)=>Math.sin(x), latex:"y' = \\sin x",    exact:(x,x0,y0)=>y0-Math.cos(x)+Math.cos(x0) },
  'logistic':{ f:(x,y)=>y*(1-y),    latex:"y' = y(1-y)",     exact:(x,x0,y0)=>{const e=Math.exp(-(x-x0));return y0/(y0+(1-y0)*e);} },
  'x2':      { f:(x,_)=>x*x,        latex:"y' = x^2",        exact:(x,x0,y0)=>y0+(x**3-x0**3)/3 },
};

// ── Fine RK4 for "exact" fallback ─────────────────────────────────────────────
function exactFine(f,x0,y0,xEnd,N=2000){
  const dt=(xEnd-x0)/N; let x=x0, y=y0;
  for(let i=0;i<N;i++){
    const k1=f(x,y), k2=f(x+dt/2,y+dt/2*k1), k3=f(x+dt/2,y+dt/2*k2), k4=f(x+dt,y+dt*k3);
    y+=dt/6*(k1+2*k2+2*k3+k4); x+=dt;
  }
  return y;
}

function exactArr(ode,x0,y0,xArr){
  if(ode.exact) return xArr.map(x=>ode.exact(x,x0,y0));
  // fallback: integrate step by step
  const res=[y0]; let prev=y0;
  for(let i=1;i<xArr.length;i++){
    res.push(exactFine(ode.f,xArr[i-1],prev,xArr[i]));
    prev=res[i];
  }
  return res;
}

const CFG={displayModeBar:false,responsive:true};
const BASE={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(16,32,56,0.6)',
            font:{color:'#D2E0EE',family:'system-ui,-apple-system,sans-serif'},
            margin:{l:50,r:16,t:20,b:44}};
const AX={gridcolor:'#1A304D',zerolinecolor:'#2A4060',zerolinewidth:1.5};

function sv(id,v){document.getElementById(id).textContent=parseFloat(v).toFixed(1);}
function g(id){return parseFloat(document.getElementById(id).value);}

function build(){
  const key=document.getElementById('ode-sel').value;
  const ode=ODES[key];
  const x0=g('x0-s'), y0=g('y0-s'), h=g('h-s'), n=parseInt(g('n-s'));

  // Euler steps
  const xE=[x0], yE=[y0];
  for(let i=0;i<n;i++){
    xE.push(xE[i]+h);
    yE.push(yE[i]+h*ode.f(xE[i],yE[i]));
  }

  const xEnd=xE[xE.length-1];

  // Exact solution on a fine grid
  const xFine=Array.from({length:300},(_,i)=>x0+i*(xEnd-x0)/299);
  const yExact=exactArr(ode,x0,y0,xFine);

  // Exact at Euler x-points for error
  const yExactAtE=exactArr(ode,x0,y0,xE);

  // Slope (tangent line) segments at each Euler point
  const slopeXs=[], slopeYs=[];
  for(let i=0;i<n;i++){
    const slope=ode.f(xE[i],yE[i]);
    const dx=h*0.45;
    slopeXs.push(xE[i]-dx, xE[i]+dx, null);
    slopeYs.push(yE[i]-slope*dx, yE[i]+slope*dx, null);
  }

  // Error bars (vertical lines from Euler to exact)
  const errXs=[], errYs=[];
  for(let i=1;i<=n;i++){
    errXs.push(xE[i],xE[i],null);
    errYs.push(yE[i],yExactAtE[i],null);
  }

  const traces=[
    // Exact solution
    {x:xFine,y:yExact,mode:'lines',line:{color:'#27A96C',width:2.5},name:'Exact'},
    // Error verticals
    {x:errXs,y:errYs,mode:'lines',line:{color:'#D44848',width:1.2,dash:'dot'},
     name:'Error',showlegend:true},
    // Slope lines at each Euler point
    {x:slopeXs,y:slopeYs,mode:'lines',line:{color:'#E8C040',width:1.2},
     name:'Tangent lines',showlegend:true},
    // Euler path
    {x:xE,y:yE,mode:'lines+markers',line:{color:'#4A8FD4',width:2,dash:'dash'},
     marker:{color:'#4A8FD4',size:8,line:{color:'white',width:1}},name:"Euler's method"},
    // Initial condition
    {x:[x0],y:[y0],mode:'markers',
     marker:{color:'#E87040',size:12,symbol:'star',line:{color:'white',width:1.5}},
     name:'(x₀, y₀)'},
  ];

  Plotly.react('main-plot',traces,{
    ...BASE,showlegend:true,
    legend:{x:0.01,y:0.99,bgcolor:'rgba(12,26,48,0.8)',bordercolor:'#1A304D',borderwidth:1,font:{size:11}},
    xaxis:{title:'x',...AX},yaxis:{title:'y',...AX},
  },CFG);

  // Metrics
  const yEfinal=yE[n], yTfinal=yExactAtE[n];
  document.getElementById('m-yE').textContent=yEfinal.toFixed(5);
  document.getElementById('m-yT').textContent=yTfinal.toFixed(5);
  document.getElementById('m-err').textContent=Math.abs(yEfinal-yTfinal).toExponential(2)
    .replace('e+','e').replace('e-0','e−').replace('e-','e−');

  // Formula
  document.getElementById('formula-box').innerHTML=katex.renderToString(
    ode.latex,{throwOnError:false,displayMode:true});

  // Step table
  const tbody=document.getElementById('step-tbody');
  tbody.innerHTML='';
  for(let i=0;i<=n;i++){
    const err=Math.abs(yE[i]-yExactAtE[i]);
    const row=document.createElement('tr');
    row.innerHTML=`
      <td style="padding:0.375rem 0.5rem;border-bottom:1px solid var(--border);text-align:right;color:var(--muted);">${i}</td>
      <td style="padding:0.375rem 0.5rem;border-bottom:1px solid var(--border);text-align:right;">${xE[i].toFixed(3)}</td>
      <td style="padding:0.375rem 0.5rem;border-bottom:1px solid var(--border);text-align:right;color:var(--primary);font-family:monospace;">${yE[i].toFixed(5)}</td>
      <td style="padding:0.375rem 0.5rem;border-bottom:1px solid var(--border);text-align:right;color:#27A96C;font-family:monospace;">${yExactAtE[i].toFixed(5)}</td>
      <td style="padding:0.375rem 0.5rem;border-bottom:1px solid var(--border);text-align:right;color:#D44848;font-family:monospace;">${err<1e-14?'< 1e−14':err.toExponential(2)}</td>`;
    tbody.appendChild(row);
  }
}

function onOdeChange(){ build(); }

function toggleExp(head){
  const body=head.nextElementSibling, arrow=head.querySelector('.expander-arrow');
  body.classList.toggle('hidden');
  arrow.style.transform=body.classList.contains('hidden')?'':'rotate(180deg)';
}

let _t;
function schedule(){clearTimeout(_t);_t=setTimeout(build,80);}
build();
</script>
</body>
</html>
