<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laplace Transform Explorer</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<div class="demo-wrap">
  <a class="back-link" href="/">← All Demos</a>
  <h1>Laplace Transform Explorer</h1>
  <p class="demo-eq">$\mathcal{L}\{f(t)\}(s) = \int_0^\infty e^{-st} f(t)\, dt = F(s)$</p>

  <div class="demo-layout">

    <!-- ── Controls ──────────────────────────────────────────────────────── -->
    <div class="controls">

      <div class="ctrl-section">Mode</div>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="mode" value="table" checked onchange="schedule()">
          Transform Table
        </label>
        <label class="radio-option">
          <input type="radio" name="mode" value="ivp" onchange="schedule()">
          Solve IVP via Laplace
        </label>
      </div>

      <!-- Table mode controls -->
      <div id="table-controls">
        <div class="ctrl-section">Function f(t)</div>
        <div class="ctrl-row">
          <select id="func-sel" onchange="schedule()" style="width:100%;padding:0.4rem 0.5rem;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:0.9rem;">
            <option value="exp">e^(at) — exponential</option>
            <option value="tn">t^n — polynomial</option>
            <option value="sin">sin(ωt)</option>
            <option value="cos">cos(ωt)</option>
            <option value="damp_sin">e^(at)·sin(ωt) — damped sine</option>
            <option value="damp_cos">e^(at)·cos(ωt) — damped cosine</option>
            <option value="step">u(t-a) — unit step</option>
            <option value="tn_exp">t^n·e^(at)</option>
          </select>
        </div>
        <div class="ctrl-row">
          <div class="ctrl-label">Parameter a <span class="ctrl-val" id="a-v">−1.00</span></div>
          <input type="range" id="a-s" min="-3" max="3" step="0.05" value="-1"
                 oninput="sv('a-v',this.value,2); schedule()">
        </div>
        <div class="ctrl-row" id="om-row">
          <div class="ctrl-label">Frequency ω <span class="ctrl-val" id="om-v">2.00</span></div>
          <input type="range" id="om-s" min="0.1" max="6" step="0.1" value="2"
                 oninput="sv('om-v',this.value,2); schedule()">
        </div>
        <div class="ctrl-row" id="n-row">
          <div class="ctrl-label">Degree n <span class="ctrl-val" id="n-v">2</span></div>
          <input type="range" id="n-s" min="0" max="5" step="1" value="2"
                 oninput="sv('n-v',this.value,0); schedule()">
        </div>
        <!-- Transform formula box -->
        <div style="margin-top:1rem;padding:0.9rem;background:rgba(255,255,255,0.05);border-radius:8px;text-align:center;" id="formula-box"></div>
      </div>

      <!-- IVP mode controls -->
      <div id="ivp-controls" style="display:none;">
        <div class="ctrl-section">ODE: y&prime;&prime; + ay&prime; + by = g(t)</div>
        <div class="ctrl-row">
          <div class="ctrl-label">Coefficient a <span class="ctrl-val" id="ia-v">3.00</span></div>
          <input type="range" id="ia-s" min="0" max="8" step="0.1" value="3"
                 oninput="sv('ia-v',this.value,2); schedule()">
        </div>
        <div class="ctrl-row">
          <div class="ctrl-label">Coefficient b <span class="ctrl-val" id="ib-v">2.00</span></div>
          <input type="range" id="ib-s" min="0" max="16" step="0.1" value="2"
                 oninput="sv('ib-v',this.value,2); schedule()">
        </div>
        <div class="ctrl-row">
          <div class="ctrl-label">y(0) <span class="ctrl-val" id="iy0-v">1.00</span></div>
          <input type="range" id="iy0-s" min="-5" max="5" step="0.1" value="1"
                 oninput="sv('iy0-v',this.value,2); schedule()">
        </div>
        <div class="ctrl-row">
          <div class="ctrl-label">y'(0) <span class="ctrl-val" id="iyp0-v">0.00</span></div>
          <input type="range" id="iyp0-s" min="-5" max="5" step="0.1" value="0"
                 oninput="sv('iyp0-v',this.value,2); schedule()">
        </div>
        <div class="ctrl-row">
          <select id="g-sel" onchange="schedule()" style="width:100%;padding:0.4rem 0.5rem;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:0.88rem;">
            <option value="zero">g(t) = 0 (homogeneous)</option>
            <option value="exp_ivp">g(t) = e^(−t)</option>
            <option value="sin_ivp">g(t) = sin(t)</option>
            <option value="cos_ivp">g(t) = cos(2t)</option>
            <option value="const_ivp">g(t) = 1 (step)</option>
          </select>
        </div>
        <div style="margin-top:1rem;padding:0.9rem;background:rgba(255,255,255,0.04);border-radius:8px;font-size:0.82rem;line-height:1.8;" id="ivp-steps"></div>
      </div>

    </div>

    <!-- ── Plots ─────────────────────────────────────────────────────────── -->
    <div>
      <div id="table-plots">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
          <div class="plot-box" id="ft-plot" style="height:280px;"></div>
          <div class="plot-box" id="Fs-plot" style="height:280px;"></div>
        </div>
      </div>
      <div id="ivp-plots" style="display:none;">
        <div class="plot-box" id="ivp-sol-plot" style="height:320px;"></div>
        <div class="plot-box" id="ivp-Ys-plot" style="height:220px;margin-top:0.75rem;"></div>
      </div>
    </div>

  </div>
</div>

<script>
let scheduledRaf=null;
function sv(id,val,dp){document.getElementById(id).textContent=dp!==''?(+val).toFixed(dp):val;}
function schedule(){if(scheduledRaf)cancelAnimationFrame(scheduledRaf);scheduledRaf=requestAnimationFrame(build);}

document.querySelectorAll('input[name="mode"]').forEach(r=>r.addEventListener('change',function(){
  document.getElementById('table-controls').style.display=this.value==='table'?'block':'none';
  document.getElementById('ivp-controls').style.display=this.value==='ivp'?'block':'none';
  document.getElementById('table-plots').style.display=this.value==='table'?'block':'none';
  document.getElementById('ivp-plots').style.display=this.value==='ivp'?'block':'none';
  schedule();
}));

function factorial(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r;}

function buildTable(){
  const sel=document.getElementById('func-sel').value;
  const a=+document.getElementById('a-s').value;
  const om=+document.getElementById('om-s').value;
  const n=+document.getElementById('n-s').value;

  // Show/hide param rows
  document.getElementById('om-row').style.display=['sin','cos','damp_sin','damp_cos'].includes(sel)?'block':'none';
  document.getElementById('n-row').style.display=['tn','tn_exp'].includes(sel)?'block':'none';

  const tMax=8;
  const Nt=400;
  const ts=Array.from({length:Nt+1},(_,i)=>tMax*i/Nt);
  let ft, Fs_formula, f_formula;

  switch(sel){
    case 'exp':
      ft=ts.map(t=>Math.exp(a*t));
      f_formula=`e^{${a>=0?'+':''}${a}t}`;
      Fs_formula=`F(s)=\\frac{1}{s-${a}} \\quad(s>${a})`;
      break;
    case 'tn':
      ft=ts.map(t=>Math.pow(t,n));
      f_formula=`t^{${n}}`;
      Fs_formula=`F(s)=\\frac{${factorial(n)}}{s^{${n+1}}}`;
      break;
    case 'sin':
      ft=ts.map(t=>Math.sin(om*t));
      f_formula=`\\sin(${om}t)`;
      Fs_formula=`F(s)=\\frac{${om}}{s^2+${om*om}}`;
      break;
    case 'cos':
      ft=ts.map(t=>Math.cos(om*t));
      f_formula=`\\cos(${om}t)`;
      Fs_formula=`F(s)=\\frac{s}{s^2+${om*om}}`;
      break;
    case 'damp_sin':
      ft=ts.map(t=>Math.exp(a*t)*Math.sin(om*t));
      f_formula=`e^{${a}t}\\sin(${om}t)`;
      Fs_formula=`F(s)=\\frac{${om}}{(s-${a})^2+${om*om}}`;
      break;
    case 'damp_cos':
      ft=ts.map(t=>Math.exp(a*t)*Math.cos(om*t));
      f_formula=`e^{${a}t}\\cos(${om}t)`;
      Fs_formula=`F(s)=\\frac{s-${a}}{(s-${a})^2+${om*om}}`;
      break;
    case 'step':
      const ta=Math.max(0,a);
      ft=ts.map(t=>t>=ta?1:0);
      f_formula=`u(t-${ta.toFixed(1)})`;
      Fs_formula=`F(s)=\\frac{e^{-${ta.toFixed(1)}s}}{s}`;
      break;
    case 'tn_exp':
      ft=ts.map(t=>Math.pow(t,n)*Math.exp(a*t));
      f_formula=`t^{${n}}e^{${a}t}`;
      Fs_formula=`F(s)=\\frac{${factorial(n)}}{(s-${a})^{${n+1}}}`;
      break;
  }

  // Clip for display
  const ftCl=ft.map(v=>Math.max(-20,Math.min(20,v)));

  // Numerically compute |F(s)| for s from 0+ to sMax
  const sMin=Math.max(0.1,a+0.1), sMax=sMin+6;
  const Ns=300;
  const sArr=Array.from({length:Ns},(_,i)=>sMin+(sMax-sMin)*i/Ns);
  const FsArr=sArr.map(s=>{
    // Numerical Laplace: ∫₀^∞ e^(-st) f(t) dt ≈ sum
    let sum=0;
    const h_s=0.01;
    for(let t=h_s/2;t<20;t+=h_s){
      sum+=Math.exp(-s*t)*ft[Math.min(Math.round(t/tMax*Nt),Nt)]*h_s;
    }
    return sum;
  });

  document.getElementById('formula-box').innerHTML=`$f(t) = ${f_formula}$<br><br>$${Fs_formula}$`;
  if(window.renderMathInElement) renderMathInElement(document.getElementById('formula-box'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});

  Plotly.react('ft-plot',[{x:ts,y:ftCl,mode:'lines',line:{color:'#4d9fff',width:2.2},name:'f(t)'}],{
    paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(16,32,56,0.6)',
    font:{color:'#D2E0EE',size:10},
    title:{text:'f(t)',font:{size:11,color:'#D2E0EE'},x:0.5},
    margin:{t:35,r:15,b:40,l:50},
    xaxis:{range:[0,tMax],title:'t',gridcolor:'rgba(255,255,255,0.06)'},
    yaxis:{title:'f(t)',gridcolor:'rgba(255,255,255,0.06)'},
    showlegend:false,
  },{responsive:true,displayModeBar:false});

  Plotly.react('Fs-plot',[{x:sArr,y:FsArr,mode:'lines',line:{color:'#f0a500',width:2.2},name:'F(s)'}],{
    paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(16,32,56,0.6)',
    font:{color:'#D2E0EE',size:10},
    title:{text:'F(s) = ℒ{f}(s)',font:{size:11,color:'#D2E0EE'},x:0.5},
    margin:{t:35,r:15,b:40,l:55},
    xaxis:{range:[sMin,sMax],title:'s',gridcolor:'rgba(255,255,255,0.06)'},
    yaxis:{title:'F(s)',gridcolor:'rgba(255,255,255,0.06)'},
    showlegend:false,
  },{responsive:true,displayModeBar:false});
}

function buildIVP(){
  const a=+document.getElementById('ia-s').value;
  const b=+document.getElementById('ib-s').value;
  const y0=+document.getElementById('iy0-s').value;
  const yp0=+document.getElementById('iyp0-s').value;
  const gSel=document.getElementById('g-sel').value;

  // Numeric RK4 solution
  const h=0.02,tMax=10;
  const Nt=Math.round(tMax/h);
  const ts=[0],ys=[y0];
  let y=y0,yp=yp0;

  const gFn=(t)=>{
    switch(gSel){
      case 'zero': return 0;
      case 'exp_ivp': return Math.exp(-t);
      case 'sin_ivp': return Math.sin(t);
      case 'cos_ivp': return Math.cos(2*t);
      case 'const_ivp': return 1;
    }
  };

  for(let i=0;i<Nt;i++){
    const t=i*h;
    const f=(_t,_y,_yp)=>gFn(_t)-a*_yp-b*_y;
    const k1y=yp,k1yp=f(t,y,yp);
    const k2y=yp+h/2*k1yp,k2yp=f(t+h/2,y+h/2*k1y,yp+h/2*k1yp);
    const k3y=yp+h/2*k2yp,k3yp=f(t+h/2,y+h/2*k2y,yp+h/2*k2yp);
    const k4y=yp+h*k3yp,k4yp=f(t+h,y+h*k3y,yp+h*k3yp);
    y+=h/6*(k1y+2*k2y+2*k3y+k4y);
    yp+=h/6*(k1yp+2*k2yp+2*k3yp+k4yp);
    ts.push(t+h); ys.push(isFinite(y)?y:NaN);
  }

  Plotly.react('ivp-sol-plot',[{x:ts,y:ys,mode:'lines',line:{color:'#4d9fff',width:2.2},name:'y(t)'}],{
    paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(16,32,56,0.6)',
    font:{color:'#D2E0EE',size:11},
    margin:{t:10,r:20,b:40,l:55},
    xaxis:{range:[0,tMax],title:'t',gridcolor:'rgba(255,255,255,0.06)'},
    yaxis:{title:'y(t)',gridcolor:'rgba(255,255,255,0.06)'},
    showlegend:false,
  },{responsive:true,displayModeBar:false});

  // Display Laplace steps
  const gNames={zero:'0',exp_ivp:'e^{-t}',sin_ivp:'\\sin t',cos_ivp:'\\cos 2t',const_ivp:'1'};
  const gS={zero:'0',exp_ivp:'\\frac{1}{s+1}',sin_ivp:'\\frac{1}{s^2+1}',cos_ivp:'\\frac{s}{s^2+4}',const_ivp:'\\frac{1}{s}'};
  const gn=gNames[gSel];
  const gLs=gS[gSel];

  const charStr=`s^2 + ${a}s + ${b}`;
  const steps=`<b>Step 1:</b> Transform the ODE<br>
$[s^2 Y - ${y0}s - ${yp0}] + ${a}[sY - ${y0}] + ${b}Y = ${gLs}$<br><br>
<b>Step 2:</b> Solve for Y(s)<br>
$Y(s)(${charStr}) = ${gLs} + ${y0}s + (${yp0+a*y0})$<br>
$Y(s) = \\dfrac{${gLs} + ${y0}s + (${yp0+a*y0})}{${charStr}}$<br><br>
<b>Step 3:</b> Partial fractions + inverse Laplace → y(t)`;

  document.getElementById('ivp-steps').innerHTML=steps;
  if(window.renderMathInElement) renderMathInElement(document.getElementById('ivp-steps'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});

  // Y(s) magnitude vs real s
  const sMin=0.1,sMax=8,Ns=300;
  const sArr=Array.from({length:Ns},(_,i)=>sMin+(sMax-sMin)*i/Ns);
  // Just show denominator magnitude (char poly)
  const charMag=sArr.map(s=>1/Math.abs(s*s+a*s+b)||0);
  Plotly.react('ivp-Ys-plot',[{x:sArr,y:charMag,mode:'lines',line:{color:'#b57ff5',width:2},name:'1/|s²+as+b|'}],{
    paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(16,32,56,0.6)',
    font:{color:'#D2E0EE',size:11},
    margin:{t:10,r:20,b:40,l:55},
    xaxis:{range:[sMin,sMax],title:'s (real)',gridcolor:'rgba(255,255,255,0.06)'},
    yaxis:{title:'|Y(s)| shape',gridcolor:'rgba(255,255,255,0.06)'},
    showlegend:false,
  },{responsive:true,displayModeBar:false});
}

function build(){
  const mode=document.querySelector('input[name="mode"]:checked').value;
  if(mode==='table') buildTable();
  else buildIVP();
}

window.addEventListener('load', build);
</script>
</body>
</html>
