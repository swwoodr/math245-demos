<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predator-Prey &amp; Ecological Models</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<div class="demo-wrap">
  <a class="back-link" href="/">← All Demos</a>
  <h1>Predator-Prey &amp; Ecological Models</h1>
  <p class="demo-eq" id="top-eq">&nbsp;</p>

  <div class="demo-layout">

    <!-- ── Controls ──────────────────────────────────────────────────────── -->
    <div class="controls">

      <div class="ctrl-section">Model</div>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="model" value="pp" checked onchange="onModelChange()">
          Predator-Prey &nbsp; (Lotka-Volterra)
        </label>
        <label class="radio-option">
          <input type="radio" name="model" value="comp" onchange="onModelChange()">
          Competition
        </label>
        <label class="radio-option">
          <input type="radio" name="model" value="coop" onchange="onModelChange()">
          Cooperation
        </label>
      </div>

      <div class="ctrl-section">Parameters</div>
      <div class="ctrl-row">
        <div class="ctrl-label" id="a-label">Prey growth a <span class="ctrl-val" id="a-v">1.0</span></div>
        <input type="range" id="a-s" min="0.1" max="3" step="0.05" value="1.0"
               oninput="sv('a-v',this.value,2); schedule()">
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label" id="b-label">Predation b <span class="ctrl-val" id="b-v">0.10</span></div>
        <input type="range" id="b-s" min="0.01" max="1" step="0.01" value="0.1"
               oninput="sv('b-v',this.value,2); schedule()">
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label" id="c-label">Predator loss c <span class="ctrl-val" id="c-v">0.50</span></div>
        <input type="range" id="c-s" min="0.05" max="2" step="0.05" value="0.5"
               oninput="sv('c-v',this.value,2); schedule()">
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label" id="d-label">Conversion d <span class="ctrl-val" id="d-v">0.05</span></div>
        <input type="range" id="d-s" min="0.01" max="0.5" step="0.01" value="0.05"
               oninput="sv('d-v',this.value,2); schedule()">
      </div>

      <div class="ctrl-section">Initial Conditions</div>
      <div class="ctrl-row">
        <div class="ctrl-label" id="x0-label">x₀ (prey) <span class="ctrl-val" id="x0-v">10</span></div>
        <input type="range" id="x0-s" min="1" max="50" step="1" value="10"
               oninput="sv('x0-v',this.value,0); schedule()">
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label" id="y0-label">y₀ (predator) <span class="ctrl-val" id="y0-v">5</span></div>
        <input type="range" id="y0-s" min="1" max="50" step="1" value="5"
               oninput="sv('y0-v',this.value,0); schedule()">
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label">Time span T <span class="ctrl-val" id="T-v">50</span></div>
        <input type="range" id="T-s" min="10" max="200" step="5" value="50"
               oninput="sv('T-v',this.value,0); schedule()">
      </div>

      <div class="ctrl-section">Display</div>
      <div class="ctrl-row">
        <label class="radio-option">
          <input type="checkbox" id="show-multi" onchange="schedule()">
          Show multiple initial conditions
        </label>
      </div>
      <div class="ctrl-row">
        <label class="radio-option">
          <input type="checkbox" id="show-jac" onchange="schedule()" checked>
          Show Jacobian at each equilibrium
        </label>
      </div>

      <div style="margin-top:1rem; padding:0.75rem; background:rgba(255,255,255,0.04); border-radius:8px; font-size:0.82rem;" id="jac-display"></div>
    </div>

    <!-- ── Plots ─────────────────────────────────────────────────────────── -->
    <div>
      <div class="plot-box" id="phase-plot" style="height:360px;"></div>
      <div class="plot-box" id="time-plot" style="height:240px; margin-top:0.75rem;"></div>
    </div>

  </div>
</div>

<script>
let scheduledRaf = null;
function sv(id, val, dp) { document.getElementById(id).textContent = dp !== '' ? (+val).toFixed(dp) : val; }
function schedule() { if (scheduledRaf) cancelAnimationFrame(scheduledRaf); scheduledRaf = requestAnimationFrame(build); }
function model() { return document.querySelector('input[name="model"]:checked').value; }

const EQ_TEX = {
  pp:   '\\dot x = ax - bxy,\\quad \\dot y = -cy + dxy',
  comp: '\\dot x = x(a - bx - y),\\quad \\dot y = y(d - cx - y)',
  coop: '\\dot x = x(a - bx + y),\\quad \\dot y = y(d + cx - y)',
};
const LABELS = {
  pp:   { a:'Prey growth a', b:'Predation b', c:'Predator loss c', d:'Conversion d', x0:'x₀ (prey)', y0:'y₀ (predator)',
          xName:'x (prey)', yName:'y (predator)' },
  comp: { a:'Growth rate a (species 1)', b:'Self-limitation b', c:'Competition c (1 on 2)', d:'Growth rate d (species 2)',
          x0:'x₀ (species 1)', y0:'y₀ (species 2)', xName:'x (species 1)', yName:'y (species 2)' },
  coop: { a:'Growth rate a (species 1)', b:'Self-limitation b', c:'Cooperation c (1 helps 2)', d:'Growth rate d (species 2)',
          x0:'x₀ (species 1)', y0:'y₀ (species 2)', xName:'x (species 1)', yName:'y (species 2)' },
};

function renderEq() {
  document.getElementById('top-eq').innerHTML = katex.renderToString(EQ_TEX[model()], {throwOnError:false});
}

function onModelChange() {
  const L = LABELS[model()];
  ['a','b','c','d'].forEach(k => { document.getElementById(`${k}-label`).childNodes[0].textContent = L[k] + ' '; });
  document.getElementById('x0-label').childNodes[0].textContent = L.x0 + ' ';
  document.getElementById('y0-label').childNodes[0].textContent = L.y0 + ' ';
  renderEq();
  schedule();
}

// ── RK4 system ────────────────────────────────────────────────────────────────
function rk4Sys(F, t, state, h) {
  const k1 = F(t, state);
  const k2 = F(t+h/2, state.map((s,i)=>s+h/2*k1[i]));
  const k3 = F(t+h/2, state.map((s,i)=>s+h/2*k2[i]));
  const k4 = F(t+h, state.map((s,i)=>s+h*k3[i]));
  return state.map((s,i) => s + h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]));
}

function solveSys(F, x0, y0, tMax) {
  const h = 0.05;
  const xs=[x0], ys=[y0], ts=[0];
  let state=[x0,y0];
  for (let t=0; t<tMax; t+=h) {
    state = rk4Sys(F, t, state, h);
    if (!isFinite(state[0])||!isFinite(state[1])||state[0]<0||state[1]<0||state[0]>1e6||state[1]>1e6) break;
    xs.push(state[0]); ys.push(state[1]); ts.push(t+h);
  }
  return {xs,ys,ts};
}

function getModel() {
  const m = model();
  const a=+document.getElementById('a-s').value, b=+document.getElementById('b-s').value;
  const c=+document.getElementById('c-s').value, d=+document.getElementById('d-s').value;
  let F, eqs;
  if (m==='pp') {
    F = (t,[x,y]) => [a*x - b*x*y, -c*y + d*x*y];
    eqs = [[0,0],[c/d, a/b]];
  } else if (m==='comp') {
    F = (t,[x,y]) => [x*(a-b*x-y), y*(d-c*x-y)];
    // Coexistence: a − bx − y = 0 and d − cx − y = 0
    eqs = [[0,0],[a/b,0],[0,d],[(a-d)/(b-c), (b*d-a*c)/(b-c)]];
  } else {
    F = (t,[x,y]) => [x*(a-b*x+y), y*(d+c*x-y)];
    // Coexistence: a − bx + y = 0 and d + cx − y = 0 (exists in the first quadrant only when b > c)
    eqs = [[0,0],[a/b,0],[0,d],[(a+d)/(b-c), d + c*(a+d)/(b-c)]];
  }
  eqs = eqs.filter(([x,y]) => isFinite(x) && isFinite(y) && x >= -1e-12 && y >= -1e-12)
           .map(([x,y]) => [Math.max(0,x), Math.max(0,y)]);
  eqs = eqs.filter((p, i) => eqs.findIndex(q => Math.hypot(q[0]-p[0], q[1]-p[1]) < 1e-9) === i);
  return {F, eqs, a, b, c, d, m};
}

function jacobianAt(F, x, y) {
  const h = 1e-6, fx1 = F(0,[x+h,y]), fx0 = F(0,[x-h,y]), fy1 = F(0,[x,y+h]), fy0 = F(0,[x,y-h]);
  return [[(fx1[0]-fx0[0])/(2*h), (fy1[0]-fy0[0])/(2*h)], [(fx1[1]-fx0[1])/(2*h), (fy1[1]-fy0[1])/(2*h)]];
}
function classifyJ(J, m) {
  const tr = J[0][0]+J[1][1], det = J[0][0]*J[1][1]-J[0][1]*J[1][0], disc = tr*tr-4*det, tol = 1e-7;
  if (det < -tol) return {name:'Saddle point (unstable)', color:'#fa8431'};
  if (Math.abs(det) <= tol) return {name:'Non-hyperbolic (zero eigenvalue)', color:'#fbbf24'};
  if (disc < 0) {
    if (Math.abs(tr) <= tol) return {name: m === 'pp' ? 'Center — orbits close up around it' : 'Center (linearization only)', color:'#fbbf24'};
    return tr < 0 ? {name:'Spiral sink (stable)', color:'#5de4c7'} : {name:'Spiral source (unstable)', color:'#ff6b8a'};
  }
  return tr < 0 ? {name:'Nodal sink (stable)', color:'#5de4c7'} : {name:'Nodal source (unstable)', color:'#ff6b8a'};
}
function eigText(J) {
  const tr = J[0][0]+J[1][1], det = J[0][0]*J[1][1]-J[0][1]*J[1][0], disc = tr*tr-4*det;
  const f = v => (Math.abs(v) < 5e-7 ? 0 : v).toFixed(3);
  if (disc >= 0) { const s = Math.sqrt(disc); return `λ = ${f((tr+s)/2)}, ${f((tr-s)/2)}`; }
  return `λ = ${f(tr/2)} ± ${f(Math.sqrt(-disc)/2)}i`;
}

function build() {
  const {F, eqs, a, b, c, d, m} = getModel();
  const L = LABELS[m];
  const x0=+document.getElementById('x0-s').value, y0=+document.getElementById('y0-s').value;
  const tMax=+document.getElementById('T-s').value;
  const showMulti = document.getElementById('show-multi').checked;
  const showJac = document.getElementById('show-jac').checked;

  const {xs,ys,ts} = solveSys(F, x0, y0, tMax);
  const xMax = Math.max(...xs, ...eqs.map(e => e[0]*1.1))*1.2||20, yMax = Math.max(...ys, ...eqs.map(e => e[1]*1.1))*1.2||20;
  const info = eqs.map(([x,y]) => { const J = jacobianAt(F, x, y); return {x, y, J, C: classifyJ(J, m)}; });

  // ── Phase portrait ──────────────────────────────────────────────────────────
  const phTraces = [];

  // Nullclines (straight lines in all three models)
  const xNull = m==='pp' ? {type:'h', v:a/b} : m==='comp' ? {line:x => a - b*x} : {line:x => b*x - a};
  const yNull = m==='pp' ? {type:'v', v:c/d} : m==='comp' ? {line:x => d - c*x} : {line:x => d + c*x};
  const nullTrace = (N, color, dash, name) => N.type === 'h' ? {x:[0,xMax], y:[N.v,N.v]}
                                          : N.type === 'v' ? {x:[N.v,N.v], y:[0,yMax]}
                                          : {x:[0,xMax], y:[N.line(0), N.line(xMax)]};
  phTraces.push({...nullTrace(xNull), mode:'lines', line:{color:'rgba(77,159,255,0.45)',width:1.5,dash:'dot'}, name:'x-nullcline (x′ = 0)', hoverinfo:'skip'});
  phTraces.push({...nullTrace(yNull), mode:'lines', line:{color:'rgba(240,165,0,0.45)',width:1.5,dash:'dash'}, name:'y-nullcline (y′ = 0)', hoverinfo:'skip'});

  if (showMulti) {
    const multiICs = [[x0*0.4, y0*0.4],[x0*0.7,y0*0.7],[x0*1.4,y0*1.4],[x0*2,y0],[x0, y0*2],[x0*0.5,y0*2],[x0*2,y0*0.5]];
    for (const [mx,my] of multiICs) {
      if (mx<=0||my<=0) continue;
      const {xs:mxs,ys:mys} = solveSys(F, mx, my, tMax);
      phTraces.push({ x:mxs, y:mys, mode:'lines', line:{color:'rgba(77,159,255,0.2)',width:1}, hoverinfo:'skip', showlegend:false });
    }
  }

  phTraces.push({ x:xs, y:ys, mode:'lines', type:'scatter', line:{color:'#4d9fff',width:2.2}, name:'Trajectory' });
  phTraces.push({ x:[x0], y:[y0], mode:'markers', type:'scatter', marker:{color:'#f0a500',size:9,symbol:'circle'}, name:`(${x0},${y0})`, showlegend:false });

  info.forEach(q => phTraces.push({ x:[q.x], y:[q.y], mode:'markers', type:'scatter',
    marker:{color:q.C.color, size:11, symbol: q.C.name.startsWith('Saddle') ? 'x' : 'circle', line:{color:'white',width:1.5}},
    name:`(${q.x.toFixed(2)}, ${q.y.toFixed(2)})`,
    hovertemplate:`(${q.x.toFixed(3)}, ${q.y.toFixed(3)})<br>${q.C.name}<extra></extra>` }));

  Plotly.react('phase-plot', phTraces, {
    paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(16,32,56,0.6)',
    font:{color:'#D2E0EE',size:11},
    margin:{t:10,r:20,b:45,l:55},
    xaxis:{range:[0,xMax],title:L.xName,gridcolor:'rgba(255,255,255,0.06)',zerolinecolor:'rgba(255,255,255,0.18)'},
    yaxis:{range:[0,yMax],title:L.yName,gridcolor:'rgba(255,255,255,0.06)',zerolinecolor:'rgba(255,255,255,0.18)'},
    showlegend:true, legend:{x:1.01,y:1,font:{size:9}},
  }, {responsive:true,displayModeBar:false});

  // ── Time series ─────────────────────────────────────────────────────────────
  Plotly.react('time-plot', [
    { x:ts, y:xs, mode:'lines', line:{color:'#4d9fff',width:2}, name:L.xName },
    { x:ts, y:ys, mode:'lines', line:{color:'#f0a500',width:2}, name:L.yName },
  ], {
    paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(16,32,56,0.6)',
    font:{color:'#D2E0EE',size:11},
    margin:{t:10,r:20,b:40,l:55},
    xaxis:{range:[0,tMax],title:'t',gridcolor:'rgba(255,255,255,0.06)'},
    yaxis:{title:'Population',gridcolor:'rgba(255,255,255,0.06)'},
    showlegend:true, legend:{x:1.01,y:1,font:{size:9}},
  }, {responsive:true,displayModeBar:false});

  // ── Jacobian at each equilibrium ────────────────────────────────────────────
  const jd = document.getElementById('jac-display');
  if (showJac) {
    const f = v => (Math.abs(v) < 5e-7 ? 0 : v).toFixed(3);
    let html = info.map(q =>
      `<b>(${q.x.toFixed(2)}, ${q.y.toFixed(2)})</b><br>J = [${f(q.J[0][0])}, ${f(q.J[0][1])}; ${f(q.J[1][0])}, ${f(q.J[1][1])}]<br>` +
      `${eigText(q.J)}<br><em style="color:${q.C.color}">${q.C.name}</em>`
    ).join('<hr style="border-color:rgba(255,255,255,0.1);margin:0.5rem 0;">');
    if (m === 'coop' && b <= c) html += '<hr style="border-color:rgba(255,255,255,0.1);margin:0.5rem 0;">No coexistence equilibrium: with c ≥ b the cooperation outweighs self-limitation, so both populations grow without bound.';
    if (m === 'comp' && info.length < 4) html += '<hr style="border-color:rgba(255,255,255,0.1);margin:0.5rem 0;">No coexistence equilibrium in the first quadrant for these parameters — one species excludes the other.';
    jd.style.display = '';
    jd.innerHTML = '<div style="font-size:0.8rem;line-height:1.6;color:var(--muted);">' + html + '</div>';
  } else {
    jd.style.display = 'none';
  }
}

window.addEventListener('load', () => { renderEq(); build(); });
</script>
</body>
</html>
