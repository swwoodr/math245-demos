<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Population Growth &amp; Decay</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<div class="demo-wrap">
  <a class="back-link" href="/">← All Demos</a>
  <h1>Population Growth &amp; Decay</h1>
  <p class="demo-eq" id="top-eq">&nbsp;</p>

  <div class="demo-layout">

    <!-- ── Controls ─────────────────────────────────────────────────────── -->
    <div class="controls">

      <div class="ctrl-section">Model</div>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="model" value="exp" checked onchange="onModelChange()">
          Exponential &nbsp; $P' = kP$
        </label>
        <label class="radio-option">
          <input type="radio" name="model" value="log" onchange="onModelChange()">
          Logistic &nbsp; $P' = rP\!\left(1-\tfrac{P}{K}\right)$
        </label>
      </div>

      <div class="ctrl-section">Parameters</div>
      <div class="ctrl-row">
        <div class="ctrl-label">P₀ (initial) <span class="ctrl-val" id="P0-v">100</span></div>
        <input type="range" id="P0-s" min="10" max="1990" step="10" value="100"
               oninput="sv('P0-v',this.value,0); schedule()">
      </div>
      <div id="exp-params">
        <div class="ctrl-row">
          <div class="ctrl-label">Rate k <span class="ctrl-val" id="k-v">0.30</span></div>
          <input type="range" id="k-s" min="-1.5" max="1.5" step="0.05" value="0.3"
                 oninput="sv('k-v',this.value,2); schedule()">
        </div>
      </div>
      <div id="log-params" style="display:none;">
        <div class="ctrl-row">
          <div class="ctrl-label">Growth rate r <span class="ctrl-val" id="r-v">0.50</span></div>
          <input type="range" id="r-s" min="0.05" max="3" step="0.05" value="0.5"
                 oninput="sv('r-v',this.value,2); schedule()">
        </div>
        <div class="ctrl-row">
          <div class="ctrl-label">Carrying cap. K <span class="ctrl-val" id="K-v">500</span></div>
          <input type="range" id="K-s" min="50" max="2000" step="10" value="500"
                 oninput="sv('K-v',this.value,0); schedule()">
        </div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label">Time span T <span class="ctrl-val" id="T-v">20</span></div>
        <input type="range" id="T-s" min="2" max="60" step="1" value="20"
               oninput="sv('T-v',this.value,0); schedule()">
      </div>

      <div id="log-display-section">
        <div class="ctrl-section">Display</div>
        <div class="ctrl-row">
          <label class="radio-option">
            <input type="checkbox" id="show-multi" onchange="build()">
            Show multiple initial conditions
          </label>
        </div>
      </div>

      <div style="margin-top:1.25rem; padding-top:1rem; border-top:1px solid var(--border);">
        <div id="formula-box" style="text-align:center; min-height:3rem; font-size:0.85rem; color:var(--muted);"></div>
      </div>

    </div>

    <!-- ── Plot panel ────────────────────────────────────────────────────── -->
    <div class="plot-panel">

      <div class="plot-box">
        <div id="main-plot" style="height:380px;"></div>
      </div>

      <!-- Phase portrait — logistic only -->
      <div id="phase-wrap" class="plot-box" style="display:none;">
        <div id="phase-plot" style="height:220px;"></div>
      </div>

      <div class="metrics-row cols-4">
        <div class="metric"><div class="metric-label">P₀</div>         <div class="metric-value plain" id="m-P0">—</div></div>
        <div class="metric"><div class="metric-label">P(T)</div>        <div class="metric-value" id="m-PT">—</div></div>
        <div class="metric"><div class="metric-label" id="m3-label">Doubling Time</div><div class="metric-value" id="m-key">—</div></div>
        <div class="metric"><div class="metric-label" id="m4-label">—</div><div class="metric-value plain" id="m-extra">—</div></div>
      </div>

    </div>
  </div>
</div>

<script>
const CFG  = {displayModeBar:false, responsive:true};
const BASE = {paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(16,32,56,0.6)',
              font:{color:'#D2E0EE', family:'system-ui,-apple-system,sans-serif'},
              margin:{l:56, r:20, t:28, b:48}};
const AX   = {gridcolor:'#1A304D', zerolinecolor:'#2A4060', zerolinewidth:1.5};

function sv(id, v, dec) {
  document.getElementById(id).textContent = parseFloat(v).toFixed(dec);
}
function g(id) { return parseFloat(document.getElementById(id).value); }
function fmtN(v, dec=2) { return isFinite(v) ? v.toFixed(dec) : '—'; }

// ── Solutions ─────────────────────────────────────────────────────────────────
function expSoln(P0, k, t) { return P0 * Math.exp(k * t); }
function logSoln(P0, r, K, t) {
  if (P0 <= 0) return 0;
  if (Math.abs(P0 - K) < 1e-9) return K;
  return K * P0 / (P0 + (K - P0) * Math.exp(-r * t));
}

function linspace(a, b, n) {
  return Array.from({length:n}, (_,i) => a + i*(b-a)/(n-1));
}

// ── Main build ────────────────────────────────────────────────────────────────
function build() {
  const model = document.querySelector('input[name="model"]:checked').value;
  const P0  = g('P0-s');
  const T   = g('T-s');
  const ts  = linspace(0, T, 500);

  if (model === 'exp') {
    buildExp(P0, g('k-s'), T, ts);
  } else {
    buildLog(P0, g('r-s'), g('K-s'), T, ts);
  }
}

function buildExp(P0, k, T, ts) {
  const ys = ts.map(t => expSoln(P0, k, t));
  const PT = expSoln(P0, k, T);

  const traces = [{
    x:ts, y:ys, mode:'lines',
    line:{color:'#4ADE80', width:3},
    name:`P(t) = P₀e^{kt}`
  }];

  // Reference line at P0
  traces.push({
    x:[0,T], y:[P0,P0], mode:'lines',
    line:{color:'#89A4BC', width:1, dash:'dot'},
    name:'P₀', showlegend:true
  });

  Plotly.react('main-plot', traces, {
    ...BASE, showlegend:true,
    title:{text: k>=0 ? 'Exponential Growth' : 'Exponential Decay', font:{size:13}},
    legend:{x:0.01,y:0.99,bgcolor:'rgba(12,26,48,0.8)',bordercolor:'#1A304D',borderwidth:1,font:{size:11}},
    xaxis:{title:'t',...AX},
    yaxis:{title:'P(t)',...AX, rangemode:'nonnegative'},
  }, CFG);

  // Hide phase plot
  document.getElementById('phase-wrap').style.display = 'none';

  // Metrics
  const dblHalf = Math.log(2) / Math.abs(k);
  document.getElementById('m-P0').textContent  = fmtN(P0,0);
  document.getElementById('m-PT').textContent  = fmtN(PT,2);
  document.getElementById('m3-label').textContent = k >= 0 ? 'Doubling Time' : 'Half-Life';
  document.getElementById('m-key').textContent  = isFinite(dblHalf) ? fmtN(dblHalf,3)+' t-units' : '—';
  document.getElementById('m4-label').textContent = 'Rate k';
  document.getElementById('m-extra').textContent = fmtN(k,3);

  // Formula
  document.getElementById('formula-box').innerHTML = katex.renderToString(
    `P(t)=P_0 e^{kt},\\quad k=${k.toFixed(2)}`,
    {throwOnError:false, displayMode:true});
  document.getElementById('top-eq').innerHTML =
    katex.renderToString(`P' = kP, \\quad P(0)=${P0.toFixed(0)}`,
    {throwOnError:false, displayMode:false});
}

function buildLog(P0, r, K, T, ts) {
  const showMulti = document.getElementById('show-multi').checked;

  const traces = [];

  // Multiple initial condition curves (faded)
  if (showMulti) {
    const ics = [0.05*K, 0.15*K, 0.35*K, 0.65*K, 0.85*K, 1.15*K, 1.5*K]
      .filter(p => p > 0 && Math.abs(p-P0) > 0.05*K);
    const fadedColors = ['rgba(74,222,128,0.3)','rgba(74,222,128,0.3)',
                         'rgba(74,222,128,0.3)','rgba(74,222,128,0.3)',
                         'rgba(74,222,128,0.3)','rgba(232,112,64,0.3)',
                         'rgba(232,112,64,0.3)'];
    ics.forEach((p0i, idx) => {
      const yi = ts.map(t => logSoln(p0i, r, K, t));
      traces.push({x:ts, y:yi, mode:'lines',
        line:{color:fadedColors[idx], width:1.5},
        name:`P₀ = ${Math.round(p0i)}`, showlegend:false,
        hoverinfo:'skip'});
    });
  }

  // Carrying capacity line
  traces.push({
    x:[0,T], y:[K,K], mode:'lines',
    line:{color:'#D44848', width:1.5, dash:'dot'},
    name:`K = ${K.toFixed(0)}  (carrying capacity)`});

  // Inflection point (only if P0 < K)
  let tinfl = null;
  if (P0 > 0 && P0 < K) {
    tinfl = (1/r) * Math.log((K-P0)/P0);
    if (tinfl > 0 && tinfl < T) {
      traces.push({
        x:[tinfl], y:[K/2], mode:'markers',
        marker:{color:'#E8C040', size:10, symbol:'diamond', line:{color:'white',width:1.5}},
        name:'Inflection point (P = K/2)'});
    }
  }

  // Main solution curve
  const ys = ts.map(t => logSoln(P0, r, K, t));
  traces.push({x:ts, y:ys, mode:'lines',
    line:{color:'#4ADE80', width:3},
    name:`P(t), P₀ = ${P0.toFixed(0)}`});

  Plotly.react('main-plot', traces, {
    ...BASE, showlegend:true,
    title:{text:'Logistic Growth', font:{size:13}},
    legend:{x:0.01,y:0.99,bgcolor:'rgba(12,26,48,0.8)',bordercolor:'#1A304D',borderwidth:1,font:{size:11}},
    xaxis:{title:'t',...AX},
    yaxis:{title:'P(t)',...AX, rangemode:'nonnegative'},
  }, CFG);

  // ── Phase portrait ──
  document.getElementById('phase-wrap').style.display = '';
  const pVals = linspace(0, K * 1.4, 400);
  const dpVals = pVals.map(p => r * p * (1 - p/K));

  // Direction arrows (sample points along the parabola)
  const arrowP = [], arrowDP = [];
  [0.1,0.25,0.4,0.55,0.7,0.85,1.0,1.15,1.3].forEach(frac => {
    const pp = frac * K;
    if (pp >= 0) { arrowP.push(pp); arrowDP.push(r*pp*(1-pp/K)); }
  });

  const phaseTraces = [
    // Zero line
    {x:[0,K*1.4], y:[0,0], mode:'lines',
     line:{color:'#2A4060',width:1}, showlegend:false, hoverinfo:'skip'},
    // dP/dt curve
    {x:pVals, y:dpVals, mode:'lines',
     line:{color:'#4ADE80',width:2.5}, name:"P' = rP(1−P/K)"},
    // Equilibria
    {x:[0,K], y:[0,0], mode:'markers',
     marker:{color:['#D44848','#4ADE80'], size:10,
             symbol:['circle-open','circle'],
             line:{color:['#D44848','#4ADE80'],width:2}},
     name:'Equilibria', showlegend:true},
    // Current P0 on the phase portrait
    {x:[P0], y:[r*P0*(1-P0/K)], mode:'markers',
     marker:{color:'#E8C040',size:11,symbol:'star',line:{color:'white',width:1.5}},
     name:`Current P₀ = ${P0.toFixed(0)}`},
  ];

  Plotly.react('phase-plot', phaseTraces, {
    ...BASE,
    margin:{l:56, r:20, t:30, b:44},
    title:{text:"Phase portrait  P' vs P", font:{size:12}},
    showlegend:true,
    legend:{x:0.01,y:0.99,bgcolor:'rgba(12,26,48,0.8)',bordercolor:'#1A304D',borderwidth:1,font:{size:10}},
    xaxis:{title:'P',...AX, range:[0, K*1.4]},
    yaxis:{title:"P'(t)",...AX},
  }, CFG);

  // Metrics
  const PT = logSoln(P0, r, K, T);
  document.getElementById('m-P0').textContent  = fmtN(P0,0);
  document.getElementById('m-PT').textContent  = fmtN(PT,1);
  document.getElementById('m3-label').textContent = 'Carrying Cap. K';
  document.getElementById('m-key').textContent  = fmtN(K,0);
  document.getElementById('m4-label').textContent = tinfl && tinfl < T ? 'Inflection t' : 'Growth Rate r';
  document.getElementById('m-extra').textContent = tinfl && tinfl < T ? fmtN(tinfl,2) : fmtN(r,2);

  // Formula
  document.getElementById('formula-box').innerHTML = katex.renderToString(
    `P(t)=\\dfrac{K P_0}{P_0+(K-P_0)e^{-rt}}`,
    {throwOnError:false, displayMode:true});
  document.getElementById('top-eq').innerHTML =
    katex.renderToString(
      `P' = rP\\!\\left(1-\\tfrac{P}{K}\\right),\\quad P(0)=${P0.toFixed(0)},\\; K=${K.toFixed(0)}`,
      {throwOnError:false, displayMode:false});
}

// ── Model switch ──────────────────────────────────────────────────────────────
function onModelChange() {
  const isLog = document.querySelector('input[name="model"]:checked').value === 'log';
  document.getElementById('exp-params').style.display = isLog ? 'none' : '';
  document.getElementById('log-params').style.display = isLog ? ''     : 'none';
  document.getElementById('log-display-section').style.display = isLog ? '' : 'none';
  build();
}

let _t;
function schedule() { clearTimeout(_t); _t = setTimeout(build, 80); }
window.addEventListener('load', build);
</script>
</body>
</html>
