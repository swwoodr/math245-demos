<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slope Field Explorer</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<div class="demo-wrap">
  <a class="back-link" href="/">← All Demos</a>
  <h1>Slope Field Explorer</h1>
  <p class="demo-eq">$y' = f(x,\, y)$</p>

  <div class="demo-layout">

    <!-- ── Controls ──────────────────────────────────────────────────────── -->
    <div class="controls">

      <div class="ctrl-section">ODE: y&prime; = f(x, y)</div>
      <div class="ctrl-row">
        <select id="preset-sel" onchange="applyPreset()" style="width:100%; padding:0.4rem 0.5rem; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:0.9rem;">
          <option value="y-x">y − x</option>
          <option value="x*y-2*x">x(y − 2)</option>
          <option value="sin(x)">sin(x)</option>
          <option value="y*(y-2)">y(y − 2)</option>
          <option value="y*y-x">y² − x</option>
          <option value="-y/x">−y / x</option>
          <option value="Math.exp(-x*x)-y">e^(−x²) − y</option>
          <option value="x*y">xy</option>
          <option value="custom">— custom —</option>
        </select>
      </div>
      <div class="ctrl-row" id="custom-row" style="display:none;">
        <input type="text" id="custom-expr" placeholder="e.g.  y*y - Math.sin(x)"
               style="width:100%; padding:0.4rem 0.5rem; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:6px; font-family:var(--font-mono); font-size:0.85rem;"
               oninput="customChanged()">
        <div id="expr-error" style="color:#f06;font-size:0.78rem;margin-top:0.3rem;display:none;">Invalid expression</div>
      </div>

      <div class="ctrl-section">Window</div>
      <div class="ctrl-row">
        <div class="ctrl-label">x range <span class="ctrl-val" id="xr-v">±5</span></div>
        <input type="range" id="xr-s" min="2" max="10" step="1" value="5"
               oninput="sv('xr-v','±'+this.value,''); schedule()">
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label">y range <span class="ctrl-val" id="yr-v">±5</span></div>
        <input type="range" id="yr-s" min="2" max="10" step="1" value="5"
               oninput="sv('yr-v','±'+this.value,''); schedule()">
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label">Grid density <span class="ctrl-val" id="dn-v">20</span></div>
        <input type="range" id="dn-s" min="8" max="30" step="2" value="20"
               oninput="sv('dn-v',this.value,0); schedule()">
      </div>

      <div class="ctrl-section">Arrow Style</div>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="arrow-style" value="unit" checked onchange="schedule()">
          Unit length (direction only)
        </label>
        <label class="radio-option">
          <input type="radio" name="arrow-style" value="slope" onchange="schedule()">
          Scaled by slope magnitude
        </label>
      </div>

      <div class="ctrl-section">Solution Curves</div>
      <p style="font-size:0.8rem;color:var(--muted);margin:0 0 0.5rem;">Click the plot to trace a solution curve through that point.</p>
      <button onclick="clearICs()" style="width:100%;padding:0.4rem;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;font-size:0.85rem;">Clear All Curves</button>
    </div>

    <!-- ── Plot ──────────────────────────────────────────────────────────── -->
    <div>
      <div class="plot-box" id="sf-plot" style="height:480px;"></div>
      <div class="metric-row" id="ic-info" style="margin-top:0.75rem; min-height:1.5rem; font-size:0.82rem; color:var(--muted); text-align:center;"></div>
    </div>

  </div><!-- demo-layout -->
</div><!-- demo-wrap -->

<script>
// ── State ────────────────────────────────────────────────────────────────────
const ICS = [];          // [{x0,y0}]
const COLORS = ['#4d9fff','#f0a500','#5de4c7','#ff6b8a','#b57ff5','#ffd166','#06d6a0','#ef476f'];
let scheduledRaf = null;
let currentF = null;

const PRESETS = {
  'y-x':            (x,y) => y - x,
  'x*y-2*x':        (x,y) => x*(y - 2),
  'sin(x)':         (x,y) => Math.sin(x),
  'y*(y-2)':        (x,y) => y*(y-2),
  'y*y-x':          (x,y) => y*y - x,
  '-y/x':           (x,y) => x === 0 ? NaN : -y/x,
  'Math.exp(-x*x)-y':(x,y)=> Math.exp(-x*x) - y,
  'x*y':            (x,y) => x*y,
};

const PRESET_LABELS = {
  'y-x':             'y - x',
  'x*y-2*x':         'x(y-2)',
  'sin(x)':          '\\sin(x)',
  'y*(y-2)':         'y(y-2)',
  'y*y-x':           'y^2 - x',
  '-y/x':            '-y/x',
  'Math.exp(-x*x)-y':'e^{-x^2} - y',
  'x*y':             'xy',
};

// ── Utilities ────────────────────────────────────────────────────────────────
function sv(id, val, dp) { document.getElementById(id).textContent = dp !== '' ? (+val).toFixed(dp) : val; }

function schedule() {
  if (scheduledRaf) cancelAnimationFrame(scheduledRaf);
  scheduledRaf = requestAnimationFrame(build);
}

function applyPreset() {
  const sel = document.getElementById('preset-sel').value;
  document.getElementById('custom-row').style.display = sel === 'custom' ? 'block' : 'none';
  if (sel !== 'custom') {
    currentF = PRESETS[sel];
    document.getElementById('expr-error').style.display = 'none';
    schedule();
  }
}

function customChanged() {
  const expr = document.getElementById('custom-expr').value.trim();
  try {
    const fn = new Function('x', 'y', '"use strict"; return (' + expr + ')');
    fn(0, 0); // test call
    currentF = fn;
    document.getElementById('expr-error').style.display = 'none';
    schedule();
  } catch(e) {
    document.getElementById('expr-error').style.display = 'block';
  }
}

function clearICs() {
  ICS.length = 0;
  document.getElementById('ic-info').textContent = '';
  schedule();
}

// ── RK4 integrator ───────────────────────────────────────────────────────────
function rk4Step(f, x, y, h) {
  const k1 = f(x, y);
  const k2 = f(x + h/2, y + h/2 * k1);
  const k3 = f(x + h/2, y + h/2 * k2);
  const k4 = f(x + h, y + h * k3);
  return y + h/6 * (k1 + 2*k2 + 2*k3 + k4);
}

function traceCurve(f, x0, y0, xMin, xMax, yMin, yMax) {
  const h = 0.05;
  const xs = [], ys = [];
  let x = x0, y = y0;
  // forward
  while (x <= xMax + h) {
    if (y < yMin - 1 || y > yMax + 1) break;
    if (!isFinite(y)) break;
    xs.push(x); ys.push(y);
    y = rk4Step(f, x, y, h);
    x += h;
  }
  // backward
  x = x0; y = y0;
  const bxs = [], bys = [];
  while (x >= xMin - h) {
    if (y < yMin - 1 || y > yMax + 1) break;
    if (!isFinite(y)) break;
    bxs.unshift(x); bys.unshift(y);
    y = rk4Step(f, x, y, -h);
    x -= h;
  }
  return {
    x: bxs.concat(xs),
    y: bys.concat(ys),
  };
}

// ── Main build ───────────────────────────────────────────────────────────────
function build() {
  const f = currentF;
  if (!f) return;

  const xR  = +document.getElementById('xr-s').value;
  const yR  = +document.getElementById('yr-s').value;
  const N   = +document.getElementById('dn-s').value;
  const style = document.querySelector('input[name="arrow-style"]:checked').value;

  const xMin = -xR, xMax = xR, yMin = -yR, yMax = yR;
  const dx = (xMax - xMin) / N;
  const dy = (yMax - yMin) / N;

  // Arrow half-length as fraction of cell size
  const arrowHalf = 0.35 * Math.min(dx, dy);

  // Compute slope field arrows as annotation-free line traces
  // Each arrow = short line segment centred at grid point
  const arrowX = [], arrowY = [];

  let maxSlope = 0;
  const slopes = [];
  for (let i = 0; i <= N; i++) {
    for (let j = 0; j <= N; j++) {
      const gx = xMin + i * dx;
      const gy = yMin + j * dy;
      const s = f(gx, gy);
      slopes.push({gx, gy, s});
      if (isFinite(s)) maxSlope = Math.max(maxSlope, Math.abs(s));
    }
  }

  for (const {gx, gy, s} of slopes) {
    if (!isFinite(s) || isNaN(s)) continue;
    const angle = Math.atan(s);
    let len = arrowHalf;
    if (style === 'slope') {
      len = arrowHalf * (maxSlope > 0 ? Math.sqrt(Math.abs(s) / maxSlope) : 0.5);
    }
    const cdx = len * Math.cos(angle);
    const cdy = len * Math.sin(angle);
    arrowX.push(gx - cdx, gx + cdx, null);
    arrowY.push(gy - cdy, gy + cdy, null);
  }

  const traces = [{
    x: arrowX, y: arrowY,
    mode: 'lines', type: 'scatter',
    line: { color: 'rgba(100,160,255,0.5)', width: 1.2 },
    hoverinfo: 'skip',
    name: 'Slope field',
  }];

  // Solution curves
  for (let i = 0; i < ICS.length; i++) {
    const {x0, y0} = ICS[i];
    const curve = traceCurve(f, x0, y0, xMin, xMax, yMin, yMax);
    traces.push({
      x: curve.x, y: curve.y,
      mode: 'lines', type: 'scatter',
      line: { color: COLORS[i % COLORS.length], width: 2.2 },
      name: `(${x0.toFixed(2)}, ${y0.toFixed(2)})`,
    });
    // IC dot
    traces.push({
      x: [x0], y: [y0],
      mode: 'markers', type: 'scatter',
      marker: { color: COLORS[i % COLORS.length], size: 8, symbol: 'circle' },
      showlegend: false, hoverinfo: 'skip',
    });
  }

  const layout = {
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(16,32,56,0.6)',
    font: { color: '#D2E0EE', family: 'Inter, sans-serif', size: 12 },
    margin: { t: 10, r: 20, b: 45, l: 50 },
    xaxis: { range: [xMin, xMax], title: 'x', gridcolor: 'rgba(255,255,255,0.06)', zerolinecolor: 'rgba(255,255,255,0.18)' },
    yaxis: { range: [yMin, yMax], title: 'y', gridcolor: 'rgba(255,255,255,0.06)', zerolinecolor: 'rgba(255,255,255,0.18)', scaleanchor: 'x' },
    showlegend: ICS.length > 0,
    legend: { x: 1.01, y: 1, font: { size: 10 } },
    dragmode: false,
  };

  Plotly.react('sf-plot', traces, layout, { responsive: true, displayModeBar: false });

  // Attach click handler once
  if (!document.getElementById('sf-plot')._clickBound) {
    document.getElementById('sf-plot')._clickBound = true;
    document.getElementById('sf-plot').on('plotly_click', function(data) {
      if (data.points && data.points.length) {
        const pt = data.points[0];
        if (ICS.length >= COLORS.length) ICS.shift();
        ICS.push({ x0: pt.x, y0: pt.y });
        const info = ICS.map((ic, i) =>
          `<span style="color:${COLORS[i % COLORS.length]}">●</span> (${ic.x0.toFixed(2)}, ${ic.y0.toFixed(2)})`
        ).join('  ');
        document.getElementById('ic-info').innerHTML = info;
        schedule();
      }
    });
  }
}

window.addEventListener('load', () => {
  currentF = PRESETS['y-x'];
  build();
});
</script>
</body>
</html>
